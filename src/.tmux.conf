set -g mouse on
set -g mode-keys vi

# Address vim mode switching delay (http://superuser.com/a/252717/65504).
set -s escape-time 0

set -g pane-active-border-style fg=red

set -g history-limit 10000

# Show windows as clickable tabs, with a "+" button to open a new one.
set -g status-style bg=colour235,fg=colour250
set -g status-left " #S "
set -g status-left-style bg=colour238,fg=colour250,bold
set -g window-status-format " #I #W "
set -g window-status-style bg=colour237,fg=colour245
set -g window-status-current-format " #I #W "
set -g window-status-current-style bg=colour31,fg=colour231,bold
set -g window-status-bell-style bg=colour130,fg=colour231
set -g window-status-separator " "
%hidden TAB="#[range=window|#{window_index} #{E:window-status-style}#{?window_bell_flag, #{E:window-status-bell-style},}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]"
%hidden CURRENT_TAB="#[range=window|#{window_index} list=focus #{E:window-status-current-style}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]"
%hidden SEP="#{?loop_last_flag,,#{window-status-separator}}"
%hidden NEW_TAB="#[range=user|new bg=colour238,fg=colour250,bold] + #[norange default]"
set -g status-format[0] "\
#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default] \
#[list=on align=left]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:${TAB}${SEP},${CURRENT_TAB}${SEP}}\
#[nolist] ${NEW_TAB}\
#[align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
bind -n MouseDown1Status if -F "#{==:#{mouse_status_range},new}" { new-window } { switch-client -t = }
